<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1217">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Feed Mixer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <a class="brand" href="#" data-go="home">Feed Mixer</a>
    <nav>
      <a href="#" data-go="home">Load</a>
      <a href="#" data-go="rations">Rations</a>
      <a href="#" data-go="ingredients">Ingredients</a>
      <a href="#" data-go="pens">Pens</a>
      <a href="#" data-go="history">History</a>
      <a href="#" data-go="dashboard">Dashboard</a>
      <a href="#" data-go="users">Users</a>
      <a href="#" data-go="settings">Settings</a>
    </nav>
    <button class="user-chip" id="user-chip" data-action="lock" title="Lock so the next person signs in with their PIN" hidden>
      <b></b><span>Lock</span>
    </button>
    <a class="scale" href="#" data-go="settings" aria-label="Scale status">
      <span id="scale-dot" class="dot"></span>
      <span id="scale-type" class="tag"></span>
      <b data-live="gross">—</b> lb
    </a>
  </header>
  <main id="app"></main>
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-msg">
      <p id="modal-msg"></p>
      <input id="modal-input" type="number" inputmode="numeric" hidden>
      <div class="row">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-ok">OK</button>
      </div>
    </div>
  </div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
